apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: book
  template:
    metadata:
      labels:
        app: book
    spec:
      containers:
        - name: book-container
          image: YOUR_DOCKER_USERNAME/book-service:latest
          ports:
            - containerPort: 3000
